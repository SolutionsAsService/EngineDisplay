<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <h1>3D Engine Viewer</h1>
        <p>Select an engine to explore:</p>
        <div id="model-container"></div>

        <div id="description">
            <h3>Engine Description</h3>
            <p id="engine-info">Select an engine to see its details here.</p>
        </div>
    </div>
    <div id="engine-selector">
        <button onclick="loadModel('car')">Car Engine</button>
        <button onclick="loadModel('aircraft')">Aircraft Engine</button>
        <button onclick="loadModel('diesel')">Diesel Engine</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
